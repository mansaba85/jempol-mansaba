version: '3'

services:
  app:
    build: .
    container_name: mansaba_app
    restart: unless-stopped
    ports:
      - "8085:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL wajib diisi di environment stack}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET wajib diisi di environment stack}
      - TZ=Asia/Jakarta
    depends_on:
      - db
    volumes:
      - mansaba_uploads:/app/server/uploads

  db:
    image: mysql:8.0
    container_name: mansaba_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=mansaba_db
      - MYSQL_USER=mansaba_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi di environment stack}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi di environment stack}
      - TZ=Asia/Jakarta
    volumes:
      - mansaba_db_data:/var/lib/mysql

volumes:
  mansaba_db_data:
  mansaba_uploads:
